[project]
name = "github-trending-reporter"
version = "1.0.0"
description = "每日/每周抓取 GitHub Trending，AI 摘要后推送到邮件/微信/QQ"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "anthropic>=0.34",
    "openai>=1.50",
    "python-dotenv>=1.0",
]

[project.scripts]
github-trending = "main:main"
